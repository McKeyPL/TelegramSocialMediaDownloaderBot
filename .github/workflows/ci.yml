name: CI and release package

on:
  pull_request:
    branches: [beta]
  push:
    branches: [beta]

permissions:
  contents: read

jobs:
  package:
    name: Test and build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-22.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64
    env:
      BOT_API_COMMIT: 5df614c91dab8662cfbb24a501ec89949fdcfebb # Telegram Bot API 10.5
      PACKAGE_TARGET: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Install and validate dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile sources and check imports
        run: |
          python -m compileall -q .
          python -c "import bs4, ffmpeg, getuseragent, instagrapi, PIL, requests, selenium, telebot, tendo, urllib3, yt_dlp; import bot, run_bot"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check out the official Telegram Bot API source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tdlib/telegram-bot-api
          ref: ${{ env.BOT_API_COMMIT }}
          path: .native-source
          submodules: recursive
          persist-credentials: false
      - name: Build and verify Bot API on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_bot_api_windows.ps1 -BotApiCommit $env:BOT_API_COMMIT -BuildOnly
      - name: Configure Bot API on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ gperf libssl-dev zlib1g-dev ninja-build
          cmake -S .native-source -B .native-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DOPENSSL_USE_STATIC_LIBS=TRUE -DZLIB_USE_STATIC_LIBS=ON \
            '-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc'
      - name: Configure Bot API on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          OPENSSL_VERSION: 3.5.9
          OPENSSL_SHA256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
        run: |
          brew install gperf
          archive="$RUNNER_TEMP/openssl-$OPENSSL_VERSION.tar.gz"
          source="$RUNNER_TEMP/openssl-$OPENSSL_VERSION"
          prefix="$RUNNER_TEMP/bot-openssl"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$OPENSSL_SHA256" "$archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          (
            cd "$source"
            ./Configure "darwin64-$(uname -m)-cc" no-shared no-tests --prefix="$prefix" --libdir=lib
            make -j2
            make install_sw
          )
          mkdir -p native-bundle/licenses
          cp "$source/LICENSE.txt" native-bundle/licenses/OpenSSL.txt
          cmake -S .native-source -B .native-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DOPENSSL_ROOT_DIR="$prefix" -DOPENSSL_USE_STATIC_LIBS=TRUE
      - name: Build and stage the native server
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test "$(git -C .native-source rev-parse HEAD)" = "$BOT_API_COMMIT"
          cmake --build .native-build --config Release --target telegram-bot-api --parallel 2
          cmake --install .native-build --config Release --prefix "$PWD/native-bundle"
          mkdir -p native-bundle/licenses
          cp .native-source/LICENSE_1_0.txt native-bundle/licenses/Telegram-Bot-API.txt
          cp .native-source/td/LICENSE_1_0.txt native-bundle/licenses/TDLib.txt
      - name: Verify Linux executable and dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary=native-bundle/bin/telegram-bot-api
          "$binary" --version
          dependencies="$(ldd "$binary")"
          printf '%s\n' "$dependencies"
          unexpected="$(printf '%s\n' "$dependencies" | awk '$1 !~ /^(linux-vdso\.so\.1|ld-linux-(x86-64|aarch64)\.so\.[12]|lib(c|m|dl|pthread|rt|resolv)\.so\.[26])$/ || /not found/')"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected Linux runtime dependencies:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          cp /usr/share/doc/libssl-dev/copyright native-bundle/licenses/OpenSSL.txt
          cp /usr/share/doc/zlib1g-dev/copyright native-bundle/licenses/zlib.txt
          cat /usr/share/doc/libgcc-s1/copyright /usr/share/doc/libstdc++6/copyright > native-bundle/licenses/GCC.txt
      - name: Verify macOS executable and dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          binary=native-bundle/bin/telegram-bot-api
          "$binary" --version
          dependencies="$(otool -L "$binary")"
          printf '%s\n' "$dependencies"
          unexpected="$(printf '%s\n' "$dependencies" | awk 'NR > 1 && $1 !~ /^\/(usr\/lib|System\/Library)\//')"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected macOS runtime dependencies:\n%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Start bundled Bot API on loopback
        shell: bash
        run: |
          python - <<'PY'
          import os
          import socket
          import subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from run_bot import server_is_ready, wait_until_ready

          binary = Path("native-bundle", "bin", "telegram-bot-api" + (".exe" if os.name == "nt" else "")).resolve()
          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
              port = listener.getsockname()[1]
          with TemporaryDirectory() as data:
              command = [str(binary), "--local", "--http-ip-address", "127.0.0.1",
                         "--http-port", str(port), "--dir", data]
              env = {**os.environ, "TELEGRAM_API_ID": "123", "TELEGRAM_API_HASH": "1" * 32}
              process = subprocess.Popen(command, cwd=data, env=env)
              try:
                  wait_until_ready(process, lambda: server_is_ready(port), 20, lambda: False, "Bundled Bot API")
              finally:
                  if process.poll() is None:
                      process.terminate()
                      try:
                          process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait()
          PY
      - name: Package exact commit and record its checksum
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        shell: bash
        run: |
          python scripts/package_release.py --ref "$GITHUB_SHA" --output-dir dist \
            --native-dir native-bundle --native-target "$PACKAGE_TARGET" --bot-api-commit "$BOT_API_COMMIT"
          cat dist/*.zip.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        with:
          name: telegram-social-media-downloader-bot-${{ github.sha }}-${{ matrix.platform }}
          path: dist/telegram-social-media-downloader-bot-${{ github.sha }}-${{ matrix.platform }}.zip*
          if-no-files-found: error
          compression-level: 0
